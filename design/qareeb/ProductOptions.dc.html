    .field { display: flex; flex-direction: column; gap: 6px; }
    .label { font-size: 14px; font-weight: 500; color: #193E2D; }
    .label .opt { font-weight: 400; color: #626C61; }
    .input { min-height: 48px; padding: 12px 14px; border-radius: 12px; border: 1px solid #E4E7DC;

    .input.ph { color: #8B948A; }
    .textarea { min-height: 110px; align-items: flex-start; }
    .hint { font-size: 14px; color: #626C61; }
    .divider { height: 1px; background: #E4E7DC; }
    .num { font-variant-numeric: tabular-nums; }
    .img-fallback { background: #EDF2E4; display: flex; align-items: center; justify-content: center; color: #8DA88F; }
    .focus-ring { outline: 2px solid #20583B; outline-offset: 2px; }
